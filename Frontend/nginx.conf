worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # 1. Zmiana protokołu na https:// - zapobiega wymuszaniu przekierowań 302 przez Azure/Spring
            proxy_pass https://lakicraft-backend.internal.nicebeach-823a1a81.northeurope.azurecontainerapps.io;
            
            # === POPRAWKA DLA SRODOWISKA AZURE (NAPRAWIA 502 BAD GATEWAY) ===
            # Wymuszamy nagłówek Host, aby wewnętrzny router Azure rozpoznał docelową aplikację
            proxy_set_header Host lakicraft-backend.internal.nicebeach-823a1a81.northeurope.azurecontainerapps.io;
            
            # Włączamy mechanizm SNI, żeby uzgadnianie certyfikatu SSL (handshake) zakończyło się sukcesem
            proxy_ssl_server_name on;
            proxy_ssl_name lakicraft-backend.internal.nicebeach-823a1a81.northeurope.azurecontainerapps.io;
            # ===============================================================

            # 2. Wyłączenie weryfikacji SSL - niezbędne wewnątrz prywatnej sieci Azure Container Apps, 
            # aby Nginx nie odrzucał wewnętrznych certyfikatów
            proxy_ssl_verify off;

            # 3. Mechanizm przechwytywania przekierowań - jeśli backend spróbuje wysłać nagłówek przekierowania,
            # Nginx podmieni go w locie na ścieżkę relatywną widoczną dla przeglądarki jako /api/
            proxy_redirect http://lakicraft-backend.internal.nicebeach-823a1a81.northeurope.azurecontainerapps.io/ /api/;
            proxy_redirect https://lakicraft-backend.internal.nicebeach-823a1a81.northeurope.azurecontainerapps.io/ /api/;

            # Pozostałe poprawne nagłówki proxy
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 15s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}