name: Deploy - Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  backend-build-deploy:
    name: Backend - Build & Deploy to Render
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Backend JAR
        working-directory: ./Backend
        run: mvn clean package -DskipTests
      
      - name: Deploy to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" ]; then
            curl --request POST \
              --url "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
              --header 'content-type: application/json' \
              --data '{"clearCache": true}'
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_BACKEND secret not set"
          fi
      
      - name: Notify Deployment
        run: |
          echo "✅ Backend deployed to Render"

  frontend-build-deploy:
    name: Frontend - Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci
      
      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build
      
      - name: Deploy to Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" ]; then
            curl --request POST \
              --url "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}" \
              --header 'content-type: application/json' \
              --data '{"clearCache": true}'
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_FRONTEND secret not set"
          fi
      
      - name: Notify Deployment
        run: |
          echo "✅ Frontend deployed to Render"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [backend-build-deploy, frontend-build-deploy]
    if: always()
    
    steps:
      - name: Check Deployment Status
        run: |
          if [ "${{ needs.backend-build-deploy.result }}" == "success" ] && \
             [ "${{ needs.frontend-build-deploy.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
