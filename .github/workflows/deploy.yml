name: Deploy - Azure Production

on:
  push:
    branches:
      - feature/devops
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: lakicraftreg2026
  BACKEND_IMAGE_NAME: lakicraft-backend
  FRONTEND_IMAGE_NAME: lakicraft-frontend
  # === NOWE: PODAJ NAZWĘ SWOJEGO KLASTRA AKS ===
  AKS_CLUSTER_NAME: lakicraft-aks 
  AKS_RESOURCE_GROUP: lakicraft-prod-rg

jobs:
  backend-test-build-deploy:
    name: Backend - Test, Docker Build & Push to Azure
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lakicraft_prod
          POSTGRES_USER: lakicraft_user
          POSTGRES_PASSWORD: lakicraft_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lakicraft_user -d lakicraft_prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Backend Tests
        working-directory: ./Backend
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: lakicraft_prod
          PGUSER: lakicraft_user
          PGPASSWORD: lakicraft_secure_password
        run: mvn test

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and Push Backend Docker Image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} -f Backend/Dockerfile ./Backend
          docker tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.BACKEND_IMAGE_NAME }}:latest
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.BACKEND_IMAGE_NAME }}:latest

      # === NOWY KROK: LOGOWANIE I WDROŻENIE BACKENDU DO AKS ===
      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy Backend to AKS
        run: |
          # Jeśli Twoje pliki k8s (deploymenty) są w repozytorium w folderze np. k8s, odkomentuj poniższą linię:
          # kubectl apply -f k8s/
          
          # Zmusza Kubernetes do pobrania najnowszego obrazu ":latest" z ACR i restartu podów
          kubectl rollout restart deployment lakicraft-app-backend

  frontend-test-build-deploy:
    name: Frontend - Test, Docker Build & Push to Azure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci
      
      - name: Run Frontend Tests
        working-directory: ./Frontend
        run: npm run test -- --run || echo "No tests"

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and Push Frontend Docker Image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} -f Frontend/Dockerfile ./Frontend
          docker tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }}:latest
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.FRONTEND_IMAGE_NAME }}:latest

      # === NOWY KROK: LOGOWANIE I WDROŻENIE FRONTENDU DO AKS ===
      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy Frontend to AKS
        run: |
          # Jeśli Twoje pliki k8s (deploymenty) są w repozytorium w folderze np. k8s, odkomentuj poniższą linię:
          # kubectl apply -f k8s/
          
          # Zmusza Kubernetes do pobrania najnowszego obrazu ":latest" z ACR i restartu podów
          kubectl rollout restart deployment lakicraft-frontend-deployment