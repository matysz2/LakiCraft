name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Backend Tests
        working-directory: ./Backend
        run: mvn clean test -DskipITs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
      
      - name: Run Integration Tests
        working-directory: ./Backend
        run: mvn verify -DskipUnitTests=true
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: testdb
          PGUSER: postgres
          PGPASSWORD: postgres
      
      - name: Build Backend
        working-directory: ./Backend
        run: mvn clean package -DskipTests
      
      - name: Upload Backend Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./Backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-jar
          path: Backend/target/lakicraft-*.jar
          retention-days: 5

  frontend-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./Frontend
        run: npm run lint
        continue-on-error: true
      
      - name: Run Frontend Tests
        working-directory: ./Frontend
        run: npm run test:coverage
      
      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build
      
      - name: Upload Frontend Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./Frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: Frontend/dist
          retention-days: 5

  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run SonarQube Analysis (Optional)
        run: |
          echo "SonarQube analysis can be configured here"
        continue-on-error: true

  build-success:
    name: Build Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, quality-check]
    
    steps:
      - name: All checks passed
        run: echo "✅ All checks passed successfully!"
