# ===================================================================
# KONFIGURACJA SERWERA
# ===================================================================
# Jeśli zmienna ${PORT} nie istnieje, serwer uruchomi się na domyślnym porcie 8081
server.port=${PORT:8081}
spring.application.name=lakicraft

# ===================================================================
# KONFIGURACJA BAZY DANYCH (POSTGRESQL)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5444}/${PGDATABASE:lakicraft_prod}
spring.datasource.username=${PGUSER:lakicraft_user}
spring.datasource.password=${PGPASSWORD:lakicraft_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# KONFIGURACJA JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.datasource.hikari.connectionInitSql=SET NAMES 'UTF8';

# ===================================================================
# SESJA I PLIKI
# ===================================================================
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===================================================================
# KONFIGURACJA SERWERA POCZTY (MAIL)
# ===================================================================
spring.mail.host=smtp.wp.pl
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===================================================================
# KONFIGURACJA MONITORINGU (ACTUATOR & PROMETHEUS)
# ===================================================================
# Eksponujemy endpointy potrzebne do monitorowania klastra i metryk
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator

# Wymuszamy włączenie endpointu prometheusa
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Tagowanie dla Grafany
management.metrics.tags.application=lakicraft-backend

# ===================================================================
# LOGOWANIE (Dla diagnozy startu aplikacji)
# ===================================================================
# Zwiększenie poziomu logowania dla Actuatora, aby upewnić się, że widzimy jego start
logging.level.org.springframework.boot.actuate=DEBUG