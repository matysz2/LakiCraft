# ===================================================================
# KONFIGURACJA SERWERA
# ===================================================================
# Jeśli zmienna ${PORT} nie istnieje, serwer uruchomi się na domyślnym porcie 8080
server.port=${PORT:8081}
spring.application.name=lakicraft

# ===================================================================
# KONFIGURACJA BAZY DANYCH (POSTGRESQL)
# ===================================================================
# Stosujemy składnię ${ZMIENNA:WARTOSC_DOMYSLNA} dla środowiska lokalnego:
# Host: localhost, Port: 5444 (nasz wolny port z Dockera), Baza: lakicraft_prod
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5444}/${PGDATABASE:lakicraft_prod}
spring.datasource.username=${PGUSER:lakicraft_user}
spring.datasource.password=${PGPASSWORD:lakicraft_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# KONFIGURACJA JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Połączenie w kodowaniu UTF-8
spring.datasource.hikari.connectionInitSql=SET NAMES 'UTF8';

# ===================================================================
# SESJA I PLIKI
# ===================================================================
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ===================================================================
# KONFIGURACJA SERWERA POCZTY (MAIL)
# ===================================================================
spring.mail.host=smtp.wp.pl
spring.mail.port=587
# Dla maila nie dajemy domyślnych wartości (musi zostać podany sekret)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===================================================================
# KONFIGURACJA MONITORINGU (ACTUATOR & MICROMETER)
# ===================================================================
# Eksponujemy punkty kontrolne: health (dla klastra) oraz prometheus (dla monitoringu)
management.endpoints.web.exposure.include=health,prometheus

# Włączamy szczegółowy status zdrowia oraz aktywujemy endpoint Prometheusa
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Tagowanie wszystkich metryk nazwą aplikacji w celu łatwego filtrowania w Grafanie
management.metrics.tags.application=lakicraft-backend